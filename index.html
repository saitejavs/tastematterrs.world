/* — dialog — */
.dialog-backdrop {

.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }
.btn { border: 1px solid var(--color-divider); }
.btn-primary { border-color: var(--color-accent); }

     sense — what it is actually like to taste, see, hear or hold
     diff  — how it differs from the nearest thing anyone else makes

   rank: 5 = a handful of hands · 4 = one village or one facility

];

<script>
(function () {
  const CATS = window.CATEGORIES;
  const ITEMS = window.ITEMS;
  const catById = new Map(CATS.map(c => [c.id, c]));
  const ICON = {
    food:  '<path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M6 8c0-2 2.5-3.5 6-3.5S18 6 18 8"/>',    sweet: '<path d="M8 9.5a4 4 0 0 1 8 0"/><path d="M8 9.5 12 21l4-11.5"/>',
    drink: '<path d="M4 6h11v7a5.5 5.5 0 0 1-11 0z"/><path d="M15 8h2.5a2.5 2.5 0 0 1 0 5H15"/><path d="M3 21h13"/>',
    tech:  '<rect x="7" y="7" width="10" height="10"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',

    bikes: '<circle cx="5" cy="17" r="3"/><circle cx="19" cy="17" r="3"/><path d="M8 17h8l-3.5-5H8"/><path d="M16 12l2-3h2.5"/>',

    hist:  '<path d="M7 3h10M7 21h10"/><path d="M8 3v3c0 3 4 3 4 6s-4 3-4 6v3M16 3v3c0 3-4 3-4 6s4 3 4 6v3"/>',
    park:  '<path d="M12 3 6.5 12h11z"/><path d="M12 8 8.5 16h7z"/><path d="M12 16v5"/><path d="M9 21h6"/>',
    scent: '<path d="M10 3h4v3.5l3.4 6a5.4 5.4 0 0 1-4.7 8.5h-1.4A5.4 5.4 0 0 1 6.6 12.5L10 6.5z"/><path d="M9.5 14h5"/>',
    sound: '<path d="M9 3v7a3 3 0 0 0 6 0V3"/><path d="M12 13v8"/><path d="M9.5 21h5"/>',

  };
  const glyph = (id, s) => '<svg width="' + (s || 15) + '" height="' + (s || 15) +
    '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + (ICON[id] || ICON.mon) + '</svg>';

  /* per-category colour — muted, one hue per section, steel stays the ground */
  const HUE = { food: "#c0552f", sweet: "#c04f86", drink: "#a07a1f", tech: "#2f7fb0",
    cars: "#b03a3a", bikes: "#5a63c0", cloth: "#1f8a78", craft: "#6e7c33", uni: "#4a4fa0",
    mon: "#8a7250", nat: "#2f9350", move: "#148f9a", hist: "#8c4a9e", park: "#3f7a33",
    scent: "#7f5aa8", sound: "#b0663a", pig: "#46608f" };
  const lift = (hex, amt) => {
    const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const m = v => Math.round(v + (255 - v) * amt);
    return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")";
  };
  const hue = id => lift(HUE[id] || "#5980a6", 0.34);

  const state = { active: new Set(CATS.map(c => c.id)), sub: null, country: null, q: "", sel: null, spin: true,
    rot: [-20, -12], zoom: 1, land: null, borders: null };

  /* ── metrics ────────────────────────────────────── */
  function refreshMeta() {
    document.getElementById("m-entries").textContent = ITEMS.length;
    document.getElementById("m-cats").textContent = CATS.length;
    document.getElementById("m-countries").textContent =
      new Set(ITEMS.flatMap(i => String(i.country || "").split(" / "))).size;
  }
  refreshMeta();

  const subsOf = id => {
    const declared = (catById.get(id) || {}).subs || [];
    const present = new Set(ITEMS.filter(i => i.cat === id &&
      (!state.country || countriesOf(i).includes(state.country))).map(i => i.sub || "Other"));
    return declared.filter(s => present.has(s))
      .concat([...present].filter(s => !declared.includes(s)).sort());
  };

  const countriesOf = i => String(i.country || "").split(" / ").map(s => s.trim()).filter(Boolean);
  const visible = () => ITEMS.filter(i => state.active.has(i.cat) &&
    (!state.country || countriesOf(i).includes(state.country)) &&
    (!state.sub || state.active.size !== 1 || (i.sub || "Other") === state.sub) &&
    (!state.q || (i.name + " " + i.place + " " + i.country + " " + (i.sub || "") + " " +
      catById.get(i.cat).name).toLowerCase().includes(state.q)));

  /* ── rail: categories ────────────────────────────────── */
  const catsEl = document.getElementById("cats");
  catsEl.innerHTML = CATS.map(c => {
    const n = ITEMS.filter(i => i.cat === c.id).length;
    return '<button class="cat" data-cat="' + c.id + '" aria-pressed="true" style="--c:' + hue(c.id) +
      '" title="' + c.note + '"><span class="gl">' + glyph(c.id) + '</span><span class="nm">' + c.name +
      '</span><span class="ct mono">' + n + '</span></button>';
  }).join("");
  catsEl.addEventListener("click", e => {
    const b = e.target.closest(".cat"); if (!b) return;
    const id = b.dataset.cat;
    if (state.active.size === CATS.length) { state.active = new Set([id]); }
    else if (state.active.has(id)) { state.active.delete(id);
      if (!state.active.size) state.active = new Set(CATS.map(c => c.id)); }
    else state.active.add(id);
    state.sub = null;
    syncCats(); renderSubs(); renderRows(); renderMarks();
  });
  function syncCats() {
    const all = state.active.size === CATS.length;
    catsEl.querySelectorAll(".cat").forEach(b =>
      b.setAttribute("aria-pressed", all || state.active.has(b.dataset.cat) ? "true" : "false"));
  }

  /* ── rail: country ───────────────────────────────────── */
  const cpick = document.getElementById("cpick"), cselect = document.getElementById("country");
  function buildCountries() {
    const tally = new Map();
    ITEMS.forEach(i => countriesOf(i).forEach(c => tally.set(c, (tally.get(c) || 0) + 1)));
    const list = [...tally.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    cselect.innerHTML = '<option value="">All countries — ' + ITEMS.length + ' entries</option>' +
      list.map(e => '<option value="' + esc(e[0]) + '"' + (state.country === e[0] ? " selected" : "") +
        '>' + esc(e[0]) + " — " + e[1] + '</option>').join("");
    cpick.classList.toggle("on", !!state.country);
  }
  function setCountry(c) {
    state.country = c || null;
    cpick.classList.toggle("on", !!state.country);
    if (state.country && !visible().length) {          /* keep the pick meaningful */
      state.active = new Set(CATS.map(x => x.id)); state.sub = null; syncCats(); renderSubs();
    }
    countCats(); renderRows(); renderMarks();
    if (!state.country) return;
    const l = visible();
    if (!l.length) return;
    const lon = d3.mean(l, i => i.lon), lat = d3.mean(l, i => i.lat);
    const span = Math.max(d3.max(l, i => Math.abs(i.lat - lat)) * 2,
      d3.max(l, i => Math.abs(i.lon - lon)) * 1.4, 3);
    flyToPoint(lon, lat, Math.max(1.6, Math.min(5.2, 62 / span)));
  }
  cselect.addEventListener("change", () => setCountry(cselect.value));
  document.getElementById("country-clear").addEventListener("click", () => {
    cselect.value = ""; setCountry(null); tweenZoom(1);
  });
  function countCats() {
    catsEl.querySelectorAll(".cat").forEach(b => {
      const n = ITEMS.filter(i => i.cat === b.dataset.cat &&
        (!state.country || countriesOf(i).includes(state.country))).length;
      b.querySelector(".ct").textContent = n;
      b.style.opacity = n ? "" : ".28";
    });
  }

  /* ── rail: subsections ─────────────────────────────── */
  const subsEl = document.getElementById("subs");
  function renderSubs() {
    if (state.active.size !== 1) { subsEl.hidden = true; subsEl.innerHTML = ""; return; }
    const id = [...state.active][0], list = subsOf(id);
    if (list.length < 2) { subsEl.hidden = true; subsEl.innerHTML = ""; return; }
    subsEl.hidden = false;
    subsEl.style.setProperty("--c", hue(id));
    subsEl.innerHTML = '<span class="kicker" style="color:' + hue(id) + '">' + catById.get(id).name + ' — subsections</span>' +
      '<button class="sub" data-sub="" aria-pressed="' + (!state.sub) + '">All</button>' +
      list.map(s => '<button class="sub" data-sub="' + s + '" aria-pressed="' +
        (state.sub === s) + '">' + s + '</button>').join("");
  }
  subsEl.addEventListener("click", e => {
    const b = e.target.closest(".sub"); if (!b) return;
    state.sub = b.dataset.sub || null;
    renderSubs(); renderRows(); renderMarks();
  });

  /* ── rail: index ─────────────────────────────────────── */
  const rowsEl = document.getElementById("rows");
  function renderRows() {
    const list = visible();
    document.getElementById("idx-count").textContent = list.length + " / " + ITEMS.length;
    document.getElementById("m-shown").textContent = list.length;
    position.__total = list.length;
    const grouped = state.active.size === 1 && !state.sub;
    if (grouped) {
      const order = subsOf([...state.active][0]);
      list.sort((a, b) => order.indexOf(a.sub || "Other") - order.indexOf(b.sub || "Other"));
    }
    let last = null;
    rowsEl.innerHTML = list.map(i => {
      let head = "";
      const s = i.sub || "Other";
      if (grouped && s !== last) { head = '<div class="grouphead" style="--c:' + hue(i.cat) + '">' + s + '</div>'; last = s; }
      return head + '<button class="row' + (state.sel === i ? ' on' : '') + '" style="--c:' + hue(i.cat) +
        '" data-k="' + key(i) +
        '"><span class="gl">' + glyph(i.cat, 12) + '</span><span><span class="t">' + esc(i.name) +
        (i.user ? ' <span style="font-size:9.5px;letter-spacing:.14em;color:var(--color-accent-700)">YOURS</span>' : '') +
        '</span><br><span class="s">' + esc(i.place) + " · " + esc(i.country) + '</span></span></button>';
    }).join("")
      || '<div style="padding:20px var(--space-6);font-size:13px;color:var(--color-neutral-700)">No entry matches that.</div>';
  }
  rowsEl.addEventListener("click", e => {
    const b = e.target.closest(".row"); if (b) select(byKey(b.dataset.k));
  });
  const key = i => i.cat + "|" + i.name;
  const byKey = k => ITEMS.find(i => key(i) === k);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
    ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  document.getElementById("q") && document.getElementById("q").addEventListener("input", e => {
    state.q = e.target.value.trim().toLowerCase(); renderRows(); renderMarks();
  });

  /* ── globe ───────────────────────────────────────────── */
  const stage = document.getElementById("stage"), cv = document.getElementById("globe"),
    ctx = cv.getContext("2d"), layer = d3.select("#layer"), tip = document.getElementById("tip");
  const proj = d3.geoOrthographic().rotate(state.rot).precision(0.9);
  const path = d3.geoPath(proj, ctx);
  const grat = d3.geoGraticule10();
  let W = 0, H = 0, R = 0;

  function size() {
    W = stage.clientWidth; H = stage.clientHeight;
    R = Math.max(120, Math.min(W, H) * 0.41);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    proj.scale(R * state.zoom).translate([W / 2, H / 2]);
    layer.attr("viewBox", "0 0 " + W + " " + H);
    drawBezel(); draw(); renderMarks();
  }

  /* ── zoom ─────────────────────────────────────── */
  const zval = document.getElementById("zval");
  function setZoom(z) {
    state.zoom = Math.max(1, Math.min(7, z));
    proj.scale(R * state.zoom);
    zval.textContent = state.zoom.toFixed(1) + "×";
    layer.select("#bezel").attr("display", state.zoom > 1.03 ? "none" : null);
    draw(); position();
  }
  document.getElementById("zin").addEventListener("click", () => setZoom(state.zoom * 1.35));
  document.getElementById("zout").addEventListener("click", () => setZoom(state.zoom / 1.35));
  document.getElementById("zreset").addEventListener("click", () => { setZoom(1); setSpin(true); });
  cv.addEventListener("wheel", e => {
    e.preventDefault(); setZoom(state.zoom * (e.deltaY < 0 ? 1.11 : 1 / 1.11));
  }, { passive: false });
  cv.addEventListener("dblclick", e => {
    const b = cv.getBoundingClientRect(), p = proj.invert([e.clientX - b.left, e.clientY - b.top]);
    if (p) flyToPoint(p[0], p[1], Math.min(7, state.zoom * 1.9));
  });

  function drawBezel() {
    const cx = W / 2, cy = H / 2, ticks = [];
    for (let a = 0; a < 360; a += 7.5) {
      const long = a % 30 === 0, r0 = R + 14, r1 = R + (long ? 26 : 20), t = a * Math.PI / 180;
      ticks.push('<line x1="' + (cx + Math.cos(t) * r0).toFixed(1) + '" y1="' + (cy + Math.sin(t) * r0).toFixed(1) +
        '" x2="' + (cx + Math.cos(t) * r1).toFixed(1) + '" y2="' + (cy + Math.sin(t) * r1).toFixed(1) +
        '" stroke="var(--color-accent-' + (long ? '700' : '400') + ')" stroke-width="1"/>');
    }
    layer.html('<g id="bezel">' + ticks.join("") + '<circle cx="' + cx + '" cy="' + cy + '" r="' +
      (R + 8) + '" fill="none" stroke="var(--color-divider)"/></g><g id="marks"></g>');
  }

  function draw() {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, Rz = R * state.zoom, P = PAINT();
    const g = ctx.createRadialGradient(cx - Rz * 0.35, cy - Rz * 0.4, Rz * 0.1, cx, cy, Rz);
    g.addColorStop(0, P.s0); g.addColorStop(0.72, P.s1); g.addColorStop(1, P.s2);
    ctx.beginPath(); path({ type: "Sphere" }); ctx.fillStyle = g; ctx.fill();

    ctx.beginPath(); path(grat); ctx.strokeStyle = P.grat; ctx.lineWidth = 0.6; ctx.stroke();

    if (state.land) {
      ctx.beginPath(); path(state.land);
      ctx.fillStyle = P.landFill; ctx.fill();
      ctx.strokeStyle = P.landLine; ctx.lineWidth = 0.8; ctx.stroke();
    }
    if (state.borders) {
      ctx.beginPath(); path(state.borders);
      ctx.strokeStyle = P.border; ctx.lineWidth = 0.5; ctx.stroke();
    }
    if (state.provisional) {                  /* India's boundary, as India draws it */
      ctx.beginPath(); path(state.provisional);
      ctx.strokeStyle = P.border; ctx.lineWidth = 0.62; ctx.stroke();
    }
    ctx.beginPath(); path({ type: "Sphere" });
    ctx.strokeStyle = P.limb; ctx.lineWidth = 1.1; ctx.stroke();

    const r = proj.rotate();
    document.getElementById("coord").textContent =
      Math.abs(-r[1]).toFixed(1) + "°" + (-r[1] >= 0 ? "N " : "S ") +
      Math.abs(-r[0]).toFixed(1) + "°" + (-r[0] >= 0 ? "E" : "W");
  }

  /* ── theme ────────────────────────────────────── */
  const LIGHT = { s0: "#fbfcfd", s1: "#eaf0f6", s2: "#cfdce8", grat: "rgba(89,128,166,.30)",
    landFill: "rgba(89,128,166,.20)", landLine: "rgba(44,69,93,.85)",
    border: "rgba(44,69,93,.30)", provisional: "rgba(44,69,93,.20)", limb: "rgba(29,45,61,.75)" };
  const DARK = { s0: "#1e2c3b", s1: "#16202b", s2: "#0c1218", grat: "rgba(126,166,205,.22)",
    landFill: "rgba(126,166,205,.17)", landLine: "rgba(178,206,229,.82)",
    border: "rgba(178,206,229,.26)", provisional: "rgba(178,206,229,.18)", limb: "rgba(178,206,229,.55)" };
  const PAINT = () => DARK;
  function setTheme() {
    if (catsEl.children.length) { paintCats(); renderSubs(); renderRows(); renderPanel(); renderMarks(); }
    draw();
  }
  function paintCats() {
    catsEl.querySelectorAll(".cat").forEach(b => b.style.setProperty("--c", hue(b.dataset.cat)));
  }

  /* markers */
  let marks = null;
  function renderMarks() {
    const list = visible(), keep = new Set(list.map(key));
    ITEMS.forEach((it, n) => { it.__ord = n; });
    marks = d3.select("#marks").selectAll("g.mk")
      .data(ITEMS.filter(i => keep.has(key(i)) || state.sel === i), key)
      .join(enter => {
        const g = enter.append("g").attr("class", d => "mk" + (d.user ? " user" : ""))
          .attr("style", d => "--c:" + hue(d.cat));
        g.append("circle").attr("class", "disc").attr("r", 9.5);
        g.append("g").attr("class", "sym").attr("transform", "translate(-6.6,-6.6) scale(0.55)")
          .html(d => ICON[d.cat] || ICON.mon);
        g.append("circle").attr("class", "hit").attr("r", 12).attr("fill", "transparent");
        g.append("circle").attr("class", "cbg").attr("cx", 8.5).attr("cy", -8.5).attr("r", 0);
        g.append("text").attr("class", "cnt").attr("x", 8.5).attr("y", -5.8);
        g.on("click", (e, d) => {
          if (d.__more && state.zoom < 5.5) { flyToPoint(d.lon, d.lat, Math.min(7, state.zoom * 2.1)); return; }
          select(d);
        })
         .on("mouseenter", (e, d) => { showTip(d); })
         .on("mouseleave", () => tip.classList.remove("show"));
        return g;
      });
    position();
  }

  function position() {
    if (!marks || !W || !H) return;
    const c = proj.invert([W / 2, H / 2]);
    if (!c || !isFinite(c[0]) || !isFinite(c[1])) return;
    const shown = new Set(visible().map(key));
    const scale = state.zoom < 1.5 ? 0.74 : (state.zoom < 2.4 ? 0.87 : 1);
    /* least distance between two marks, px — tighter at world view, where the
       marks are drawn smaller, so far fewer collapse into +N clusters */
    const MIN = Math.max(9.5, 13 * scale);
    const cell = MIN, grid = new Map(), placed = [];
    const cand = [];
    marks.each(function (d) {
      const dist = d3.geoDistance([d.lon, d.lat], c);
      const el = d3.select(this);
      if (dist >= Math.PI / 2 - 0.02) { d.__off = 1; el.attr("display", "none"); return; }
      const p = proj([d.lon, d.lat]);
      cand.push({ d: d, el: el, p: p, limb: Math.min(1, (Math.PI / 2 - dist) / 0.30) });
    });
    /* stable priority: selection first, then a fixed key order — otherwise the
       cluster host swaps between frames and the marks flicker while spinning */
    cand.sort((a, b) => (state.sel === b.d) - (state.sel === a.d) ||
      (a.d.__ord - b.d.__ord));
    cand.forEach(o => {
      const gx = Math.floor(o.p[0] / cell), gy = Math.floor(o.p[1] / cell);
      let host = null;
      for (let i = -1; i <= 1 && !host; i++) for (let j = -1; j <= 1 && !host; j++) {
        const bucket = grid.get((gx + i) + ":" + (gy + j));
        if (!bucket) continue;
        for (const q of bucket) {
          /* hysteresis: a hidden mark must clear a wider gap before it returns */
          const near = o.d.__was ? MIN * 1.9 : MIN;
          if (Math.hypot(q.p[0] - o.p[0], q.p[1] - o.p[1]) < near) { host = q; break; }
        }
      }
      if (host && state.sel !== o.d) {
        host.hidden = (host.hidden || 0) + 1; o.d.__was = 1;
        if (!o.d.__off) {
          o.d.__off = 1; o.el.attr("display", "none");
          o.el.select("circle.cbg").attr("r", 0);
          o.el.select("text.cnt").text("");
        }
        return;
      }
      o.hidden = 0; o.d.__was = 0;
      const k = gx + ":" + gy;
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(o);
      placed.push(o);
    });
    placed.forEach(o => {
      const d = o.d;
      d.__off = 0; o.el.attr("display", null);
      o.el.attr("transform", "translate(" + o.p[0].toFixed(1) + "," + o.p[1].toFixed(1) + ") scale(" + scale + ")")
        .style("opacity", (0.3 + 0.7 * o.limb).toFixed(2))
        .classed("on", state.sel === d)
        .classed("dim", !shown.has(key(d)));
      d.__more = o.hidden;
      o.el.select("circle.cbg").attr("r", o.hidden ? 6.4 : 0);
      o.el.select("text.cnt").text(o.hidden ? "+" + o.hidden : "");
    });
    /* re-stacking the DOM every frame is what makes the icons blink — only do it
       when the selection actually changes */
    if (position.__sel !== state.sel) {
      position.__sel = state.sel;
      d3.select("#marks").selectAll("g.mk").sort((a, b) => (state.sel === a) - (state.sel === b));
    }
    const el = document.getElementById("m-shown");
    if (el && position.__total) el.textContent = placed.length + " / " + position.__total;
    const s = state.sel;
    let ring = d3.select("#marks").select("circle.ring");
    if (s) {
      const front = d3.geoDistance([s.lon, s.lat], c) < Math.PI / 2 - 0.02, p = proj([s.lon, s.lat]);
      if (ring.empty()) ring = d3.select("#marks").append("circle").attr("class", "ring").attr("r", 15);
      ring.attr("display", front ? null : "none").attr("cx", p[0]).attr("cy", p[1]);
      if (tip.classList.contains("show")) showTip(s);
    } else ring.remove();
  }

  function showTip(d) {
    const p = proj([d.lon, d.lat]);
    tip.textContent = d.name + (d.__more ? "  +" + d.__more + " more here" : "");
    tip.style.setProperty("--c", hue(d.cat));
    tip.style.left = p[0] + "px"; tip.style.top = (p[1] - 8) + "px";
    tip.classList.add("show");
  }

  /* drag */
  let dragging = false;
  d3.select(cv).call(d3.drag()
    .on("start", () => { dragging = true; cv.classList.add("drag"); setSpin(false); })
    .on("drag", e => {
      const r = proj.rotate(), k = 0.28 / state.zoom;
      state.rot = [r[0] + e.dx * k, Math.max(-88, Math.min(88, r[1] - e.dy * k)), 0];
      proj.rotate(state.rot); draw(); position();
    })
    .on("end", () => { dragging = false; cv.classList.remove("drag"); }));

  /* auto-spin */
  let last = performance.now(), acc = 0;
  function frame(t) {
    const dt = Math.min(t - last, 60); last = t;
    if (!W || !H) { requestAnimationFrame(frame); return; }   /* geometry not sized yet */
    if (state.spin && !dragging) {
      /* every frame, small step — a coarse step can carry a mark across the
         declutter hysteresis band in one go, which reads as popping */
      const r = proj.rotate();
      state.rot = [r[0] + dt * 0.055, r[1], 0];
      proj.rotate(state.rot); draw(); position();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const spinBtn = document.getElementById("spin");
  function setSpin(on) {
    state.spin = on;
    spinBtn.textContent = "Auto-spin: " + (on ? "on" : "off");
    spinBtn.classList.toggle("live", on);
  }
  spinBtn.addEventListener("click", () => {
    const on = !state.spin;
    setSpin(on);
    if (on && state.zoom > 1.02) tweenZoom(1);   /* spinning again pulls back out */
  });
  function tweenZoom(to) {
    const iz = d3.interpolate(state.zoom, to);
    d3.transition().duration(760).ease(d3.easeCubicInOut).tween("zoomout", () => tt => {
      state.zoom = iz(tt); proj.scale(R * state.zoom);
      zval.textContent = state.zoom.toFixed(1) + "×";
      layer.select("#bezel").attr("display", state.zoom > 1.03 ? "none" : null);
      draw(); position();
    });
  }

  function flyToPoint(lon, lat, zoomTo) {
    setSpin(false);
    const from = proj.rotate(), to = [-lon, -lat, 0], z0 = state.zoom,
      z1 = zoomTo == null ? state.zoom : Math.max(1, Math.min(7, zoomTo));
    from[0] = ((from[0] + 180) % 360 + 360) % 360 - 180;
    const i = d3.interpolate(from, to), iz = d3.interpolate(z0, z1);
    d3.transition().duration(1100).ease(d3.easeCubicInOut).tween("rot", () => tt => {
      state.zoom = iz(tt);
      proj.rotate(i(tt)).scale(R * state.zoom);
      zval.textContent = state.zoom.toFixed(1) + "×";
      layer.select("#bezel").attr("display", state.zoom > 1.03 ? "none" : null);
      draw(); position();
    });
  }
  const flyTo = d => flyToPoint(d.lon, d.lat, Math.max(state.zoom, 2.2));

  /* ── panel ───────────────────────────────────────────── */
  const panel = document.getElementById("panel");
  function select(d) {
    if (!d) return;
    state.sel = d; renderRows(); renderMarks(); renderPanel(); flyTo(d);
    const row = rowsEl.querySelector('.row.on');
    if (row) row.parentElement.parentElement.scrollTop =
      Math.max(0, row.offsetTop - row.parentElement.parentElement.clientHeight / 2);
  }
  document.getElementById("rand").addEventListener("click", () => {
    const l = visible(); if (l.length) select(l[Math.floor(Math.random() * l.length)]);
  });

  function renderPanel() {
    const d = state.sel;
    if (!d) { panel.innerHTML = emptyHTML(); return; }
    const c = catById.get(d.cat);
    const sibs = ITEMS.filter(i => i.cat === d.cat && i !== d).slice(0, 4);
    panel.innerHTML =
      '<div class="p-cat" style="--c:' + hue(d.cat) + '"><span class="kicker" style="display:flex;align-items:center;gap:6px">' +
        '<span style="color:' + hue(d.cat) + ';display:flex">' + glyph(d.cat, 12) + '</span>' +
        c.name + (d.sub ? ' <span style="color:var(--color-neutral-700)">/ ' + esc(d.sub) + '</span>' : '') +
      '</span>' + (d.tag ? '<span class="tag tag-outline">' + esc(d.tag) + '</span>' : "") + '</div>' +
      '<h2 class="p-title">' + esc(d.name) + '</h2>' +
      '<div class="p-place">' + esc(d.place) + " · " + esc(d.country) + '</div>' +
      '<div class="rule" style="margin-top:var(--space-4)"></div>' +
      '<div class="kicker" style="margin-top:var(--space-4)">Why it is special</div>' +
      '<p class="p-why" style="--c:' + hue(d.cat) + '">' + esc(d.why) + '</p>' +
      (d.more ? '<div class="kicker" style="margin-top:var(--space-6)">What makes it a taste of its own</div>' +
        '<p class="p-more">' + esc(d.more) + '</p>' : '') +
      '<table class="specs"><tbody>' +
        '<tr><th>Since</th><td>' + esc(d.since || "—") + '</td></tr>' +
        '<tr><th>Mark of</th><td>' + esc(d.mark || "—") + '</td></tr>' +
        '<tr><th>Coord</th><td class="mono">' + fmt(d.lat, "NS") + "  " + fmt(d.lon, "EW") + '</td></tr>' +
        '<tr><th>Section</th><td>' + c.name + (d.sub ? " — " + esc(d.sub) : "") + '</td></tr>' +
      '</tbody></table>' +
      '<div class="links" style="--c:' + hue(d.cat) + '">' +
        '<a href="' + esc(readMore(d)) + '" target="_blank" rel="noopener noreferrer">Read more ↗</a>' +
        '<a href="' + esc(mapLink(d)) + '" target="_blank" rel="noopener noreferrer">See the place ↗</a>' +
      '</div>' +
      '<div class="nextrow"><button class="ctrl" data-step="-1">← Previous</button>' +
        '<button class="ctrl" data-step="1">Next →</button></div>' +
      (sibs.length ? '<div class="also"><span class="kicker">Also in ' + c.name + '</span><div class="chips">' +
        sibs.map(s => '<button class="chip" data-k="' + key(s) + '">' + esc(s.name) + '</button>').join("") +
        '</div></div>' : '');
    panel.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
      const l = visible().length ? visible() : ITEMS;
      const at = l.indexOf(d), n = at < 0 ? 0 : (at + +b.dataset.step + l.length) % l.length;
      select(l[n]);
    }));
    panel.querySelectorAll(".chip").forEach(b =>
      b.addEventListener("click", () => select(byKey(b.dataset.k))));
  }
  const fmt = (v, ax) => Math.abs(v).toFixed(2) + "°" + (v >= 0 ? ax[0] : ax[1]);
  const readMore = d => d.link ||
    "https://en.wikipedia.org/w/index.php?search=" + encodeURIComponent(d.name + " " + d.place);
  const mapLink = d => "https://www.google.com/maps/search/?api=1&query=" + d.lat + "," + d.lon;

  function emptyHTML() {
    return '<div class="empty">' +
      '<span class="kicker">Start here</span>' +
      '<h3 style="margin-top:var(--space-3)">A single index of the things a place does better than anywhere else.</h3>' +
      '<p>Spin the globe and tap any mark. Each entry gets one screen: where it is, when it started, and the specific reason it became the reference point — no filler.</p>' +
      '<p style="color:var(--color-neutral-700);font-size:13px">Filter by category on the left or open a single category to see its subsections.</p>' +
      '<div class="rule" style="margin:var(--space-6) 0 0"></div>' +
      '<div class="kicker" style="margin-top:var(--space-4)">Marks on the globe</div>' +
      '<div class="legend">' + CATS.map(c =>
        '<div><span class="gl" style="color:' + hue(c.id) + '">' + glyph(c.id, 12) + '</span>' + c.name + '</div>').join("") + '</div>' +
      '<div class="rule" style="margin:var(--space-6) 0 0"></div>' +
      '<div class="kicker" style="margin-top:var(--space-4)">Featured</div>' +
      '<div class="chips">' + ["Taste Labs", "Cave of the Crystals", "EUV Lithography Systems"]
        .map(n => { const i = ITEMS.find(x => x.name === n);
          return i ? '<button class="chip" data-k="' + key(i) + '">' + n + '</button>' : ""; }).join("") +
      '</div></div>';
  }
  panel.addEventListener("click", e => {
    const b = e.target.closest(".empty .chip"); if (b) select(byKey(b.dataset.k));
  });


  /* keyboard */
  window.addEventListener("keydown", e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "Escape") {
      state.sel = null; renderPanel(); renderRows(); renderMarks();
    }
    if (e.key === "+" || e.key === "=") setZoom(state.zoom * 1.3);
    if (e.key === "-") setZoom(state.zoom / 1.3);
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      setSpin(false);
      const r = proj.rotate();
      proj.rotate([r[0] + (e.key === "ArrowRight" ? 6 : -6), r[1], 0]); draw(); position();
    }
  });

  /* ── boot ────────────────────────────────────────────── */
  setTheme();
  syncCats(); buildCountries(); countCats(); renderSubs(); renderRows(); renderPanel();
  size();
  window.addEventListener("resize", size);

  /* India is drawn with the whole of Jammu & Kashmir: the 110m country mesh
     carries line-of-control segments through the region, so those segments are
     dropped rather than any geometry being invented. */
  /* India's borders and coast are drawn from India's own published outline
     (india-outline.js), and every India segment is removed from the world
     mesh — one source for one country, so Jammu & Kashmir appears as India
     defines it with no seams to match. Nothing is hand-drawn. */
  const IN = "356";
  const involvesIndia = (a, b) => String(a.id) === IN || String(b.id) === IN;
  function indiaBorders() {
    const out = [];
    (window.INDIA_OUTLINE || []).forEach(poly =>
      (Array.isArray(poly[0][0]) ? poly : [poly]).forEach(ring => {
        if (ring.length > 1) out.push(ring);
      }));
    return { type: "MultiLineString", coordinates: out };
  }

  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
    .then(r => r.json())
    .then(topo => {
      state.land = topo.objects.land
        ? topojson.feature(topo, topo.objects.land)
        : { type: "Feature", geometry: topojson.merge(topo, topo.objects.countries.geometries) };
      state.borders = topojson.mesh(topo, topo.objects.countries,
        (a, b) => a !== b && !involvesIndia(a, b));
      state.indiaPOV = null;
      state.provisional = indiaBorders();
      draw();
      window.__toe = state;
    })
    .catch(() => { document.getElementById("coord").textContent = "geometry offline"; });
})();
</script>
</body>
</html>
